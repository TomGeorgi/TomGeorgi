<title id="title">About</title>
<desc id="desc">Hi, I&#39;m Tom! 👋 I&#39;m an Embedded Software Engineer based in Santa Barbara, CA. I spend my days working with Rust, C++, Qt, and CMake, and my nights optimizing my self-hosted infrastructure. When I&#39;m not writing embedded code, I&#39;m usually managing my Docker-based homelab infrastructure, 3D printing, or out riding sportbikes. Based in: Santa Barbara, CA</desc>
